<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Alamat</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        #alamat {
            font-size: 14px;
            color: black;
            padding: 10px;
            width: 300px;
            border: 1px solid gray;
        }
        button {
            padding: 8px 15px;
            cursor: pointer;
        }
    </style>
</head>
<body>
<h2>Form Pengisian Alamat</h2>
<form action="form2.html" method="post">
    <label for="alamat">Alamat:</label><br>
    <textarea
        name="alamat"
        id="alamat"
        cols="30"
        rows="10"
        placeholder="Masukkan alamat lengkap..."
        required></textarea>
    <br><br>
    <button type="submit">Kirim</button>
</form>
</body>
</html>
