<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Pilihan Mata Kuliah</title>
</head>
<body>
<h2>Pilihan Mata Kuliah</h2>
<form action="form3.html" method="post">
    <label for="matakuliah">Pilih Mata Kuliah:</label>
    <select name="matakuliah" id="matakuliah" required>
        <option value="">-- Pilih Mata Kuliah --</option>
        <option value="web1">Pemrograman Web Native</option>
        <option value="web2">Pemrograman Web Framework</option>
        <option value="mobile1">Pemrograman Mobile Native</option>
        <option value="mobile2">Pemrograman Mobile Lintas Platform</option>
    </select>
    <br><br>
    <button type="submit">Kirim</button>
</form>
</body>
</html>
